<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最小肥度路径：Dijkstra 的 max 版</title>
<link rel="stylesheet" href="/blog/blog_data/dsa/anim.css">
<style>
  .mf { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 4px; }
  .mf-graph { flex: 1 1 auto; min-height: 0; position: relative; }
  .mf-graph > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .mf-info { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; }
  .mf-pq { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; min-height: 24px; }
  .mf-pq .chip { display: inline-block; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--blue); background: rgba(56, 189, 248, 0.14); color: #d6f2ff; font-weight: 700; font-size: 12px; }
  .mf-pq .chip.min { border-width: 2px; padding: 1px 7px; background: rgba(56, 189, 248, 0.32); color: #fff; }
  .mf-pq .empty { font-style: italic; }
  .mf-info .cells { padding: 16px 2px 18px; gap: 3px; }
  .mf-info .cell { min-width: 34px; height: 32px; font-size: 13px; }
  .k-weight.bad { fill: var(--red); }
</style>
</head>
<body>
<div class="title">同一张图，同一套 Dijkstra：键用 max 还是 +</div>
<div class="controls" id="controls"></div>
<div class="legend">
  <span><i style="background: var(--accent)"></i>当前 / 松弛中</span>
  <span><i style="background: var(--blue)"></i>在 PQ 中</span>
  <span><i style="background: var(--green)"></i>已确定</span>
  <span><i style="background: var(--yellow)"></i>键刚更新</span>
  <span><i style="background: var(--red)"></i>不更新</span>
</div>
<div class="stage" id="stage"></div>
<div class="note" id="note"></div>
<script src="/blog/blog_data/dsa/anim.js"></script>
<script>
(function () {
  'use strict';
  const K = window.AnimKit;
  const stage = document.getElementById('stage');

  const START = 'A', TARGET = 'F';
  const NODES = [
    { id: 'A', x: 40, y: 130 }, { id: 'B', x: 160, y: 40 }, { id: 'C', x: 220, y: 220 },
    { id: 'D', x: 340, y: 40 }, { id: 'E', x: 400, y: 220 }, { id: 'F', x: 520, y: 130 },
  ];
  const EDGES = [
    ['A', 'B', 6], ['A', 'C', 2], ['B', 'C', 8], ['B', 'D', 4],
    ['C', 'E', 3], ['D', 'E', 7], ['D', 'F', 5], ['E', 'F', 9],
  ];

  const MODES = {
    max: {
      label: 'max：最小肥度',
      key: 'fat',
      combine: (a, w) => Math.max(a, w),
      show: (a, w, r) => `max(${a}, ${w}) = ${r}`,
    },
    plus: {
      label: '+：最短路',
      key: 'dist',
      combine: (a, w) => a + w,
      show: (a, w, r) => `${a} + ${w} = ${r}`,
    },
  };

  const fmt = d => (d === Infinity ? '∞' : String(d));
  const ids = NODES.map(n => n.id).slice().sort();
  const adj = new Map(ids.map(v => [v, []]));
  EDGES.forEach(([u, v, w]) => { adj.get(u).push({ v, w }); adj.get(v).push({ v: u, w }); });
  adj.forEach(list => list.sort((a, b) => (a.v < b.v ? -1 : 1)));
  const weight = (u, v) => adj.get(u).find(e => e.v === v).w;

  // Run the algorithm for one mode and record a frame at every step.
  function build(mode) {
    const M = MODES[mode];
    const key = {}, from = {}, done = {};
    ids.forEach(v => { key[v] = Infinity; from[v] = null; done[v] = false; });
    const pq = new Map();
    key[START] = 0;
    pq.set(START, 0);

    const frames = [];
    function snap(extra) {
      frames.push(Object.assign({
        mode,
        key: Object.assign({}, key),
        from: Object.assign({}, from),
        done: Object.assign({}, done),
        pq: [...pq.entries()],
        cur: null, edge: null, changed: null, path: null,
      }, extra));
    }

    snap({ note: `初始：${M.key}[${START}] = 0，其余为 ∞；PQ 里只有 <b>${START}0</b>。松弛规则：候选值 = <code>${mode === 'max' ? 'max(' + M.key + '[u], w)' : M.key + '[u] + w'}</code>。` });

    while (pq.size) {
      let u = null;
      pq.forEach((d, v) => {
        if (u === null || d < pq.get(u) || (d === pq.get(u) && v < u)) u = v;
      });
      pq.delete(u);
      done[u] = true;
      const skipped = adj.get(u).filter(e => done[e.v]).map(e => e.v);
      const todo = adj.get(u).filter(e => !done[e.v]);
      let note = u === START
        ? `取出 <b>${u}0</b>：起点确定。`
        : `取出 PQ 中最小的 <b>${u}${key[u]}</b>：${M.key}[${u}] = ${key[u]} 确定（from[${u}] = ${from[u]}）。`;
      if (skipped.length) note += `邻居 ${skipped.join('、')} 已确定，跳过。`;
      if (!todo.length) note += '没有要松弛的边。';
      snap({ cur: u, note });

      todo.forEach(({ v, w }) => {
        const cand = M.combine(key[u], w);
        const name = `${u}–${v}`;
        if (cand < key[v]) {
          const old = key[v];
          key[v] = cand;
          from[v] = u;
          pq.set(v, cand);
          const pqText = old === Infinity ? `<b>${v}${cand}</b> 入 PQ` : `PQ 里 ${v}${old} 换成 <b>${v}${cand}</b>`;
          snap({
            cur: u, edge: { u, v, kind: 'better' }, changed: v,
            note: `松弛 ${name}：${M.show(key[u], w, cand)} &lt; ${fmt(old)} → ${M.key}[${v}] = ${cand}，from[${v}] = ${u}，${pqText}。`,
          });
        } else {
          snap({
            cur: u, edge: { u, v, kind: 'worse' },
            note: `松弛 ${name}：${M.show(key[u], w, cand)} ≥ ${key[v]}，<span class="bad">不更新</span>。`,
          });
        }
      });
    }

    const mine = describe(pathTo(from));
    const other = describe(pathTo(solve(mode === 'max' ? 'plus' : 'max')));
    const last = mode === 'max'
      ? `<span class="ok">PQ 空，结束。</span>沿 from[] 回溯得 ${mine.text}：肥度 <b>${mine.fat}</b>（总长 ${mine.total}）。` +
        `最短路是 ${other.text}，总长 ${other.total}，肥度却是 ${other.fat}。`
      : `<span class="ok">PQ 空，结束。</span>沿 from[] 回溯得 ${mine.text}：总长 <b>${mine.total}</b>，肥度 ${mine.fat}。` +
        `肥度最小的是 ${other.text}（肥度 ${other.fat}，总长 ${other.total}）。`;
    snap({ path: mine.path, note: last });
    return frames;
  }

  // Same algorithm without frames; returns from[] (used for the comparison in the last caption).
  function solve(mode) {
    const M = MODES[mode];
    const key = {}, from = {}, done = {};
    ids.forEach(v => { key[v] = Infinity; from[v] = null; done[v] = false; });
    key[START] = 0;
    for (;;) {
      let u = null;
      ids.forEach(v => { if (!done[v] && key[v] !== Infinity && (u === null || key[v] < key[u])) u = v; });
      if (u === null) break;
      done[u] = true;
      adj.get(u).forEach(({ v, w }) => {
        const c = M.combine(key[u], w);
        if (!done[v] && c < key[v]) { key[v] = c; from[v] = u; }
      });
    }
    return from;
  }
  function pathTo(from) {
    const path = [];
    for (let v = TARGET; v; v = from[v]) path.unshift(v);
    return path;
  }
  function describe(path) {
    let total = 0, fat = 0;
    for (let k = 1; k < path.length; k++) {
      const w = weight(path[k - 1], path[k]);
      total += w;
      fat = Math.max(fat, w);
    }
    return { path, total, fat, text: path.join('→') };
  }

  function render(f) {
    const M = MODES[f.mode];
    const same = (e, a, b) => (e.u === a && e.v === b) || (e.u === b && e.v === a);
    const onPath = e => f.path && f.path.some((x, k) => k > 0 && same(e, f.path[k - 1], x));
    const inPq = new Set(f.pq.map(p => p[0]));
    const edgeState = e => {
      if (f.path) {
        if (onPath(e)) return 'active';
        const t = [e.v, e.u].find(x => f.from[x] && same(e, f.from[x], x));
        return t ? 'tree' : 'dim';
      }
      if (f.edge && same(e, f.edge.u, f.edge.v)) return f.edge.kind === 'better' ? 'active' : 'bad';
      const t = [e.v, e.u].find(x => f.from[x] && same(e, f.from[x], x));
      if (t) return f.done[t] ? 'tree' : 'visited';
      return '';
    };
    const svg = K.graph({
      directed: false,
      nodes: NODES,
      edges: EDGES.map(([u, v, w]) => ({ u, v, w })),
    }, {
      nodeCls: id => {
        if (f.path && f.path.includes(id)) return 'active';
        if (id === f.cur) return 'active';
        if (f.done[id]) return 'done';
        if (inPq.has(id)) return 'visited';
        return '';
      },
      edgeCls: e => edgeState(e),
      weightCls: e => {
        const c = edgeState(e);
        return c === 'active' ? 'active' : c === 'tree' ? 'done' : c === 'bad' ? 'bad' : '';
      },
      badge: id => fmt(f.key[id]),
    });

    const sorted = f.pq.slice().sort((a, b) => a[1] - b[1] || (a[0] < b[0] ? -1 : 1));
    const pqHtml = sorted.length
      ? sorted.map((p, k) => `<span class="chip${k === 0 ? ' min' : ''}">${K.esc(p[0] + p[1])}</span>`).join('')
      : '<span class="empty">（空）</span>';

    const table = K.cells(ids.map(v => fmt(f.key[v])), {
      idx: ids,
      ptr: k => {
        const v = ids[k];
        if (v === START) return '起点';
        return f.from[v] ? '←' + f.from[v] : '';
      },
      cls: (val, k) => {
        const v = ids[k];
        if (f.path && f.path.includes(v)) return 'found';
        if (v === f.cur) return 'active';
        if (v === f.changed) return 'warn';
        if (f.done[v]) return 'done';
        return '';
      },
    });

    stage.innerHTML =
      '<div class="mf">' +
        `<div class="mf-graph">${svg}</div>` +
        '<div class="mf-info">' +
          `<div class="mf-pq"><span>PQ（键 = ${M.key}）：</span>${pqHtml}</div>` +
          table +
        '</div>' +
      '</div>';
  }

  // mode switcher goes in front of the player's own buttons
  let current = 'max';
  const controls = document.getElementById('controls');
  const group = document.createElement('div');
  group.className = 'btn-group';
  const buttons = {};
  Object.keys(MODES).forEach(key => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = MODES[key].label;
    if (key === current) b.classList.add('active');
    b.addEventListener('click', () => {
      if (key === current) return;
      current = key;
      Object.keys(buttons).forEach(k => buttons[k].classList.toggle('active', k === key));
      player.load(build(key));
    });
    buttons[key] = b;
    group.appendChild(b);
  });
  controls.appendChild(group);

  const player = window.AnimKit.player({ frames: build(current), render, interval: 1400 });
})();
</script>
</body>
</html>
