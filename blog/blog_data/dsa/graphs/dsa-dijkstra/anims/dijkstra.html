<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dijkstra 逐步演示</title>
<link rel="stylesheet" href="/blog/blog_data/dsa/anim.css">
<style>
  .dj { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 4px; }
  .dj-graph { flex: 1 1 auto; min-height: 0; position: relative; }
  .dj-graph > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .dj-info { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; }
  .dj-pq { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; min-height: 24px; }
  .dj-pq .chip { display: inline-block; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--blue); background: rgba(56, 189, 248, 0.14); color: #d6f2ff; font-weight: 700; font-size: 12px; }
  .dj-pq .chip.min { border-width: 2px; padding: 1px 7px; background: rgba(56, 189, 248, 0.32); color: #fff; }
  .k-weight.bad { fill: var(--red); }
  .dj-pq .empty { font-style: italic; }
  .dj-info .cells { padding: 16px 2px 18px; gap: 3px; }
  .dj-info .cell { min-width: 34px; height: 32px; font-size: 13px; }
</style>
</head>
<body>
<div class="title">Dijkstra 逐步演示</div>
<div class="controls" id="controls"></div>
<div class="legend">
  <span><i style="background: var(--accent)"></i>当前 / 松弛中</span>
  <span><i style="background: var(--blue)"></i>在 PQ 中</span>
  <span><i style="background: var(--green)"></i>已确定</span>
  <span><i style="background: var(--yellow)"></i>dist 刚更新</span>
  <span><i style="background: var(--red)"></i>不更新</span>
</div>
<div class="stage" id="stage"></div>
<div class="note" id="note"></div>
<script src="/blog/blog_data/dsa/anim.js"></script>
<script>
(function () {
  'use strict';
  const K = window.AnimKit;
  const stage = document.getElementById('stage');

  const SCENARIOS = {
    lecture: {
      label: '课上的例子',
      directed: false,
      start: 'A',
      nodes: [
        { id: 'A', x: 30, y: 120 }, { id: 'C', x: 110, y: 40 }, { id: 'F', x: 190, y: 200 },
        { id: 'D', x: 360, y: 40 }, { id: 'B', x: 280, y: 200 }, { id: 'E', x: 440, y: 120 },
      ],
      edges: [
        ['A', 'C', 2], ['A', 'F', 3], ['C', 'D', 5], ['C', 'F', 4],
        ['F', 'B', 1], ['B', 'D', 2], ['B', 'E', 4], ['D', 'E', 6],
      ],
    },
    negative: {
      label: '负权反例',
      directed: true,
      start: 'A',
      nodes: [
        { id: 'A', x: 40, y: 120 }, { id: 'B', x: 280, y: 40 },
        { id: 'C', x: 180, y: 200 }, { id: 'D', x: 420, y: 40 },
      ],
      edges: [['A', 'B', 2], ['A', 'C', 3], ['C', 'B', -2], ['B', 'D', 2]],
    },
  };

  const fmt = d => (d === Infinity ? '∞' : String(d));
  const minus = w => (w < 0 ? '(−' + (-w) + ')' : String(w));

  // Run Dijkstra exactly as taught and record a frame at every step.
  function build(sc) {
    const ids = sc.nodes.map(n => n.id).slice().sort();
    const adj = new Map(ids.map(v => [v, []]));
    sc.edges.forEach(([u, v, w]) => {
      adj.get(u).push({ v, w });
      if (!sc.directed) adj.get(v).push({ v: u, w });
    });
    adj.forEach(list => list.sort((a, b) => (a.v < b.v ? -1 : 1)));
    const sep = sc.directed ? '→' : '–';

    const dist = {}, from = {}, done = {};
    ids.forEach(v => { dist[v] = Infinity; from[v] = null; done[v] = false; });
    const pq = new Map();
    const s = sc.start;
    dist[s] = 0;
    pq.set(s, 0);

    const frames = [];
    function snap(extra) {
      frames.push(Object.assign({
        ids,
        dist: Object.assign({}, dist),
        from: Object.assign({}, from),
        done: Object.assign({}, done),
        pq: [...pq.entries()],
        cur: null, edge: null, changed: null, final: false,
      }, extra));
    }

    snap({ note: `初始：dist[${s}] = 0，其余都是 ∞；PQ 里只有起点 <b>${s}0</b>。` });

    while (pq.size) {
      let u = null;
      pq.forEach((d, v) => {
        if (u === null || d < pq.get(u) || (d === pq.get(u) && v < u)) u = v;
      });
      pq.delete(u);
      done[u] = true;
      const skipped = adj.get(u).filter(e => done[e.v] && dist[u] + e.w >= dist[e.v]).map(e => e.v);
      const toRelax = adj.get(u).filter(e => !done[e.v] || dist[u] + e.w < dist[e.v]);
      let note = u === s
        ? `取出 <b>${u}0</b>：起点，dist[${u}] = 0 确定。`
        : `取出 PQ 中最小的 <b>${u}${dist[u]}</b>：dist[${u}] = ${dist[u]} 确定（from[${u}] = ${from[u]}）。`;
      if (skipped.length && toRelax.length) note += `邻居 ${skipped.join('、')} 已确定，跳过。`;
      else if (skipped.length) note += `邻居 ${skipped.join('、')} 都已确定，没有要松弛的边。`;
      else if (!toRelax.length) note += '没有出边要松弛。';
      snap({ cur: u, note });

      adj.get(u).forEach(({ v, w }) => {
        const nd = dist[u] + w;
        const name = `${u}${sep}${v}`;
        if (done[v]) {
          if (nd < dist[v]) {
            snap({
              cur: u, edge: { u, v, kind: 'skip' },
              note: `<span class="bad">${name}：${v} 已确定，按规则不再更新。可是 ${dist[u]} + ${minus(w)} = ${nd} &lt; ${dist[v]}，更短的路被漏掉了。</span>`,
            });
          }
          return;
        }
        if (nd < dist[v]) {
          const old = dist[v];
          dist[v] = nd;
          from[v] = u;
          const pqText = old === Infinity
            ? `<b>${v}${nd}</b> 入 PQ`
            : `PQ 里 ${v}${old} 换成 <b>${v}${nd}</b>`;
          pq.set(v, nd);
          snap({
            cur: u, edge: { u, v, kind: 'better' }, changed: v,
            note: `松弛 ${name}：${dist[u]} + ${minus(w)} = ${nd} &lt; ${fmt(old)} → dist[${v}] = ${nd}，from[${v}] = ${u}，${pqText}。`,
          });
        } else {
          snap({
            cur: u, edge: { u, v, kind: 'worse' },
            note: `松弛 ${name}：${dist[u]} + ${minus(w)} = ${nd} ≥ ${dist[v]}，<span class="bad">不更新</span>。`,
          });
        }
      });
    }

    let last;
    if (sc.directed) {
      // true shortest distances: repeat relaxation of every edge V times (no negative cycle here)
      const best = {};
      ids.forEach(v => { best[v] = Infinity; });
      best[s] = 0;
      ids.forEach(() => sc.edges.forEach(([u, v, w]) => { if (best[u] + w < best[v]) best[v] = best[u] + w; }));
      const wrong = ids.filter(v => best[v] !== dist[v]);
      last = `<span class="bad">结束。Dijkstra 给出 ${wrong.map(v => `dist[${v}] = ${dist[v]}`).join('、')}；` +
        `真正的最短距离是 ${wrong.map(v => `${v} = ${best[v]}`).join('、')}（都要经过 C→B）。</span>`;
    } else {
      const path = [];
      for (let v = 'E'; v; v = from[v]) path.unshift(v);
      last = `<span class="ok">PQ 空，结束。</span>绿色边是最短路径树。沿 from[] 回溯：${path.slice().reverse().join(' ← ')}，` +
        `所以路径 ${path.join('→')}，长度 ${dist.E}。`;
    }
    snap({ final: true, note: last });
    return frames;
  }

  function render(f) {
    const sc = SCENARIOS[current];
    const same = (e, a, b) => (e.u === a && e.v === b) || (!sc.directed && e.u === b && e.v === a);
    const inPq = new Set(f.pq.map(p => p[0]));
    const edgeState = e => {
      if (f.edge && same(e, f.edge.u, f.edge.v)) return f.edge.kind === 'better' ? 'active' : 'bad';
      const treeTo = [e.v, e.u].find(x => f.from[x] && same(e, f.from[x], x));
      if (treeTo) return f.done[treeTo] ? 'tree' : 'visited';
      if (f.final && e.neg) return 'bad';   // keep the negative edge the caption talks about visible
      return f.final ? 'dim' : '';
    };
    const spec = {
      directed: sc.directed,
      nodes: sc.nodes,
      edges: sc.edges.map(([u, v, w]) => ({ u, v, w: w < 0 ? '−' + (-w) : w, neg: w < 0 })),
    };
    const svg = K.graph(spec, {
      nodeCls: id => {
        if (f.edge && f.edge.kind === 'skip' && id === f.edge.v) return 'bad';
        if (id === f.cur) return 'active';
        if (f.done[id]) return 'done';
        if (inPq.has(id)) return 'visited';
        return '';
      },
      edgeCls: e => edgeState(e),
      weightCls: e => {
        const c = edgeState(e);
        return c === 'active' ? 'active' : c === 'tree' ? 'done' : c === 'bad' ? 'bad' : '';
      },
      badge: id => fmt(f.dist[id]),
    });

    const sorted = f.pq.slice().sort((a, b) => a[1] - b[1] || (a[0] < b[0] ? -1 : 1));
    const pqHtml = sorted.length
      ? sorted.map((p, k) => `<span class="chip${k === 0 ? ' min' : ''}">${K.esc(p[0] + p[1])}</span>`).join('')
      : '<span class="empty">（空）</span>';

    const table = K.cells(f.ids.map(v => fmt(f.dist[v])), {
      idx: f.ids,
      ptr: k => {
        const v = f.ids[k];
        if (v === sc.start) return '起点';
        return f.from[v] ? '←' + f.from[v] : '';
      },
      cls: (val, k) => {
        const v = f.ids[k];
        if (v === f.cur) return 'active';
        if (v === f.changed) return 'warn';
        if (f.edge && f.edge.kind === 'skip' && v === f.edge.v) return 'bad';
        if (f.done[v]) return 'done';
        return '';
      },
    });

    stage.innerHTML =
      '<div class="dj">' +
        `<div class="dj-graph">${svg}</div>` +
        '<div class="dj-info">' +
          `<div class="dj-pq"><span>PQ：</span>${pqHtml}</div>` +
          table +
        '</div>' +
      '</div>';
  }

  // scenario switcher goes in front of the player's own buttons
  let current = 'lecture';
  const controls = document.getElementById('controls');
  const group = document.createElement('div');
  group.className = 'btn-group';
  const buttons = {};
  Object.keys(SCENARIOS).forEach(key => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = SCENARIOS[key].label;
    if (key === current) b.classList.add('active');
    b.addEventListener('click', () => {
      if (key === current) return;
      current = key;
      Object.keys(buttons).forEach(k => buttons[k].classList.toggle('active', k === key));
      player.load(build(SCENARIOS[key]));
    });
    buttons[key] = b;
    group.appendChild(b);
  });
  controls.appendChild(group);

  const player = window.AnimKit.player({ frames: build(SCENARIOS[current]), render, interval: 1400 });
})();
</script>
</body>
</html>
