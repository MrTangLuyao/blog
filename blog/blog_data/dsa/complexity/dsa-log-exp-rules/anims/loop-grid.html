<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嵌套循环执行次数</title>
<link rel="stylesheet" href="/blog/blog_data/dsa/anim.css">
<style>
  .lg { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; }
  .lg-head { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 16px; }
  .lg-code { margin: 0; font-family: 'JBMono', 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.5; color: #ffb49d; white-space: pre; }
  .lg-ops { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lg-ops b { color: var(--accent); font-size: 16px; }
  .lg-grid { flex: 1 1 auto; min-height: 0; position: relative; }
  .lg-grid > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .g-cell { fill: none; stroke: rgba(255, 255, 255, 0.10); stroke-width: 1; }
  .g-cell.row { stroke: rgba(255, 255, 255, 0.28); }
  .g-cell.done { fill: rgba(74, 222, 128, 0.30); stroke: rgba(74, 222, 128, 0.75); }
  .g-cell.active { fill: var(--accent); stroke: var(--accent); }
  .g-lab { fill: var(--muted); font-size: 11px; text-anchor: middle; dominant-baseline: central; }
  .g-lab.cur { fill: var(--accent); font-weight: 700; }
  .g-lab.skip { opacity: 0.35; }
  @media (max-width: 420px) { .lg-code { font-size: 11px; } }
</style>
</head>
<body>
<div class="title">嵌套循环：数最内层执行了几次</div>
<div class="controls" id="controls"></div>
<div class="legend">
  <span><i style="background: var(--accent)"></i>本轮内层执行的 (i, j)</span>
  <span><i style="background: rgba(74, 222, 128, 0.6)"></i>已执行</span>
  <span><i style="border: 1px solid rgba(255,255,255,0.3)"></i>没执行</span>
</div>
<div class="stage" id="stage"></div>
<div class="note" id="note"></div>
<script src="/blog/blog_data/dsa/anim.js"></script>
<script>
(function () {
  'use strict';
  const K = window.AnimKit;
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');

  // Each scenario runs the real loops; row(i) is called at the start of each
  // outer iteration and hit(i, j) every time the innermost statement runs.
  const SCENARIOS = {
    square: {
      label: 'j < n',
      code: 'for (i = 0; i < n; i++)\n    for (j = 0; j < n; j++)\n        ops++;',
      run(n, row, hit) { for (let i = 0; i < n; i++) { row(i); for (let j = 0; j < n; j++) hit(i, j); } },
      inner: (i, n, js) => `j = 0 … ${n - 1}，内层 ${js.length} 次，每轮都一样`,
      sum: (n, t) => `每轮都是 n 次，次数固定，直接相乘：n × n = ${n} × ${n} = <b>${t}</b>，Θ(n²)。`,
    },
    pairs: {
      label: 'j = i+1',
      code: 'for (i = 0; i < n; i++)\n    for (j = i + 1; j < n; j++)\n        ops++;',
      run(n, row, hit) { for (let i = 0; i < n; i++) { row(i); for (let j = i + 1; j < n; j++) hit(i, j); } },
      inner: (i, n, js) => js.length > 1 ? `j = ${i + 1} … ${n - 1}，内层 ${js.length} 次`
        : js.length === 1 ? `只有 j = ${i + 1}，内层 1 次`
        : `j 从 ${i + 1} 开始，j &lt; n 立刻不成立，内层 0 次`,
      sum: (n, t) => `(n−1) + (n−2) + … + 1 + 0 = n(n−1)/2 = ${n}·${n - 1}/2 = <b>${t}</b>，约是正方形的一半，仍是 Θ(n²)。`,
    },
    nlogn: {
      label: 'j *= 2',
      code: 'for (i = 0; i < n; i++)\n    for (j = 1; j < n; j *= 2)\n        ops++;',
      run(n, row, hit) { for (let i = 0; i < n; i++) { row(i); for (let j = 1; j < n; j *= 2) hit(i, j); } },
      inner: (i, n, js) => `j = ${js.join(', ')}，到 ${n} 停，内层 ${js.length} 次`,
      sum: (n, t) => `每轮 log₂ n = ${Math.round(Math.log2(n))} 次，次数固定，相乘：${n} × ${Math.round(Math.log2(n))} = <b>${t}</b>，Θ(n log n)。`,
    },
    geo: {
      label: 'i *= 2, j < i',
      code: 'for (i = 1; i < n; i *= 2)\n    for (j = 0; j < i; j++)\n        ops++;',
      run(n, row, hit) { for (let i = 1; i < n; i *= 2) { row(i); for (let j = 0; j < i; j++) hit(i, j); } },
      inner: (i, n, js) => js.length > 1 ? `j = 0 … ${i - 1}，内层 ${js.length} 次` : '只有 j = 0，内层 1 次',
      sum: (n, t) => `1 + 2 + 4 + … = <b>${t}</b> &lt; 2n = ${2 * n}，Θ(n)。内层次数逐轮翻倍，要逐轮相加；按“log₂ n 轮 × 最多 n 次”相乘得到的 n log n 只是偏松的上界。`,
    },
  };

  function trace(sc, n) {
    const rows = [];
    sc.run(n, i => rows.push({ i, js: [] }), (i, j) => rows[rows.length - 1].js.push(j));
    return rows;
  }
  const total = (sc, n) => trace(sc, n).reduce((s, r) => s + r.js.length, 0);

  function build(key, n) {
    const sc = SCENARIOS[key];
    const rows = trace(sc, n);
    const frames = [];
    let ops = 0;
    frames.push({ key, n, upto: -1, ops, note: `n = ${n}。每一行是外层的一轮（一个 i 值），每一格是一对 (i, j)。外层共 <b>${rows.length}</b> 轮。` });
    rows.forEach((r, k) => {
      const before = ops;
      ops += r.js.length;
      frames.push({ key, n, upto: k, ops, note: `i = ${r.i}：${sc.inner(r.i, n, r.js)}。ops = ${before} + ${r.js.length} = <b>${ops}</b>` });
    });
    const other = n === 8 ? 16 : 8;
    const t2 = total(sc, other);
    const small = Math.min(ops, t2), big = Math.max(ops, t2);
    frames.push({ key, n, upto: rows.length, ops, note: sc.sum(n, ops) +
      `<br>n = 8 时 ${n === 8 ? ops : t2} 次，n = 16 时 ${n === 16 ? ops : t2} 次：n 翻倍，次数 ×${(big / small).toFixed(2)}。` });
    return { frames, rows };
  }

  // ── controls: scenario buttons and n buttons go in before the player's ──
  function group(items, onPick) {
    const g = document.createElement('div');
    g.className = 'btn-group';
    items.forEach(([val, text], k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      if (k === 0) b.classList.add('active');
      b.addEventListener('click', () => {
        g.querySelectorAll('button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        onPick(val);
      });
      g.appendChild(b);
    });
    controls.appendChild(g);
  }
  let curKey = 'square', curN = 8, rows = [];
  group(Object.keys(SCENARIOS).map(k => [k, SCENARIOS[k].label]), k => { curKey = k; reload(); });
  group([[8, 'n = 8'], [16, 'n = 16']], n => { curN = n; reload(); });

  function render(f) {
    const sc = SCENARIOS[f.key];
    const n = f.n;
    const C = 22, G = 3, LW = 40, TH = 20;
    const W = LW + n * (C + G), H = TH + n * (C + G);
    const rowOf = new Map(rows.map((r, k) => [r.i, k]));
    let svg = '';
    for (let j = 0; j < n; j++) svg += `<text class="g-lab" x="${LW + j * (C + G) + C / 2}" y="${TH / 2}">${j}</text>`;
    for (let i = 0; i < n; i++) {
      const k = rowOf.has(i) ? rowOf.get(i) : -1;
      const y = TH + i * (C + G);
      const cur = k >= 0 && k === f.upto;
      svg += `<text class="g-lab ${cur ? 'cur' : k < 0 ? 'skip' : ''}" x="${LW - 8}" y="${y + C / 2}" text-anchor="end" style="text-anchor:end">i=${i}</text>`;
      const hitSet = k >= 0 ? new Set(rows[k].js) : new Set();
      for (let j = 0; j < n; j++) {
        let cls = 'g-cell';
        if (k >= 0) cls += ' row';
        if (hitSet.has(j)) {
          if (k < f.upto) cls += ' done';
          else if (k === f.upto) cls += ' active';
        }
        svg += `<rect class="${cls}" x="${LW + j * (C + G)}" y="${y}" width="${C}" height="${C}" rx="4"/>`;
      }
    }
    stage.innerHTML = `<div class="lg"><div class="lg-head"><pre class="lg-code">${K.esc(sc.code)}</pre>` +
      `<div class="lg-ops">ops = <b>${f.ops}</b></div></div>` +
      `<div class="lg-grid"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${svg}</svg></div></div>`;
  }

  const first = build(curKey, curN);
  rows = first.rows;
  const player = AnimKit.player({ frames: first.frames, render, interval: 900 });
  function reload() {
    const b = build(curKey, curN);
    rows = b.rows;
    player.load(b.frames);
  }
})();
</script>
</body>
</html>
