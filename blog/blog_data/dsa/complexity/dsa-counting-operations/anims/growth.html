<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>增长率：每一级要算多久</title>
<link rel="stylesheet" href="/blog/blog_data/dsa/anim.css">
<style>
  .nbox { display: inline-flex; align-items: center; gap: 6px; }
  .nbox input[type="range"] { width: 120px; }
  .nval { min-width: 50px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .chart { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 200px; align-items: center; gap: 8px; }
  .cls { font-size: 12px; font-weight: 700; text-align: right; white-space: nowrap; }
  .track { position: relative; height: 14px; border-radius: 4px; background: rgba(255, 255, 255, 0.05); }
  .mark { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed rgba(255, 255, 255, 0.3); }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; min-width: 3px; border-radius: 4px; transition: width 0.35s, background 0.35s; }
  .bar.ok { background: var(--green); }
  .bar.slow { background: var(--yellow); }
  .bar.bad { background: var(--red); }
  .bar.over { border-radius: 4px 0 0 4px; background: linear-gradient(90deg, var(--red) 80%, rgba(248, 113, 113, 0.15)); }
  .val { font-size: 11.5px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .val .t { font-weight: 700; }
  .val .t.ok { color: var(--green); }
  .val .t.slow { color: var(--yellow); }
  .val .t.bad { color: var(--red); }
  .val .c { color: var(--muted); margin-left: 6px; }
  .axis { position: relative; height: 14px; font-size: 10px; color: var(--muted); }
  .axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  sup { font-size: 0.75em; line-height: 0; }
  @media (max-width: 520px) {
    .row { grid-template-columns: 54px minmax(0, 1fr) 92px; gap: 6px; }
    .chart { gap: 4px; }
    .cls { font-size: 11px; }
    .track { height: 11px; }
    .val { font-size: 11px; }
    .val .c { display: none; }
    .nbox input[type="range"] { width: 90px; }
  }
</style>
</head>
<body>
<div class="title">增长率：n 变大时每一级要算多久（每秒 10⁹ 次操作）</div>
<div class="controls" id="controls"></div>
<div class="legend">
  <span><i style="background: var(--green)"></i>≤ 1 秒</span>
  <span><i style="background: var(--yellow)"></i>1 秒 ~ 1 年</span>
  <span><i style="background: var(--red)"></i>超过 1 年</span>
  <span>条形 = 操作次数（对数刻度）</span>
</div>
<div class="stage" id="stage"></div>
<div class="note" id="note"></div>
<script src="/blog/blog_data/dsa/anim.js"></script>
<script>
(function () {
  'use strict';
  const K = window.AnimKit;
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');

  // <algo>
  const LOG_RATE = 9;                         // 10^9 operations per second
  const YEAR = 365.25 * 86400;                // seconds in a year
  const LOG_YEAR = Math.log10(YEAR);
  const LOG_UNIVERSE = Math.log10(1.38e10);   // age of the universe in years
  const AXIS_MAX = 30;                        // bars span 10^0 … 10^30 operations
  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  const sup = s => String(s).split('').map(c => SUP[c] || c).join('');

  // log10(n!): exact sum for small n, Stirling's series for large n
  function log10Fact(n) {
    if (n <= 5000) { let s = 0; for (let k = 2; k <= n; k++) s += Math.log10(k); return s; }
    return (n * Math.log(n) - n + 0.5 * Math.log(2 * Math.PI * n) + 1 / (12 * n)) / Math.LN10;
  }

  // every class is described by log10(number of operations) at input size n,
  // so even 3^(10^9) never overflows
  const CLASSES = [
    { name: '1', lg: () => 0 },
    { name: 'log₂ n', lg: n => Math.log10(Math.log2(n)) },
    { name: 'n', lg: n => Math.log10(n) },
    { name: 'n log₂ n', lg: n => Math.log10(n) + Math.log10(Math.log2(n)) },
    { name: 'n²', lg: n => 2 * Math.log10(n) },
    { name: 'n³', lg: n => 3 * Math.log10(n) },
    { name: '2ⁿ', lg: n => n * Math.log10(2) },
    { name: '3ⁿ', lg: n => n * Math.log10(3) },
    { name: 'n!', lg: n => log10Fact(n) },
  ];
  const SIZES = [2, 4, 8, 10, 16, 20, 30, 40, 50, 64, 100, 1000, 1e4, 1e5, 1e6, 1e7, 1e8, 1e9];
  const EPS = 1e-9;

  const fix = v => String(+v.toPrecision(3));
  // a number given by its log10: plain below 10^6, m×10^e up to 10^100000, 10^(m×10^e) beyond
  function num(lg) {
    if (lg < 6 - EPS) {
      const v = Math.pow(10, lg);
      return v < 1000 ? fix(v) : Math.round(v).toLocaleString('en-US');
    }
    if (lg < 1e5) {
      let e = Math.floor(lg + EPS), m = Math.pow(10, lg - e);
      if (+m.toFixed(1) >= 10) { m /= 10; e += 1; }
      return m.toFixed(1) + '×10<sup>' + e + '</sup>';
    }
    const e = Math.floor(Math.log10(lg));
    return '10<sup>' + (lg / Math.pow(10, e)).toFixed(2) + '×10' + sup(e) + '</sup>';
  }
  // time for 10^lg operations at 10^9 operations per second
  function time(lg) {
    const ls = lg - LOG_RATE;
    const s = Math.pow(10, ls);
    if (ls < -6 - EPS) return fix(s * 1e9) + ' ns';
    if (ls < -3 - EPS) return fix(s * 1e6) + ' µs';
    if (ls < -EPS) return fix(s * 1e3) + ' ms';
    if (s < 60) return fix(s) + ' 秒';
    if (s < 3600) return fix(s / 60) + ' 分钟';
    if (s < 86400) return fix(s / 3600) + ' 小时';
    if (s < YEAR) return fix(s / 86400) + ' 天';
    const ly = ls - LOG_YEAR;
    return (ly < 4 ? fix(Math.pow(10, ly)) : num(ly)) + ' 年';
  }
  const status = lg => (lg <= LOG_RATE + EPS ? 'ok' : lg < LOG_RATE + LOG_YEAR ? 'slow' : 'bad');
  const nText = n => (n < 1e4 ? n.toLocaleString('en-US') : '10' + sup(Math.round(Math.log10(n))));

  const REMARK = {
    20: () => '20 个盘的汉诺塔要 2²⁰ − 1 步，约 ' + time(Math.log10(Math.pow(2, 20) - 1)) + '。',
    30: () => '课上的表：n = 30 时 n! 已经不可行。',
    40: () => '40 个盘的汉诺塔约 ' + time(Math.log10(Math.pow(2, 40) - 1)) + '。',
    64: () => '64 个盘的汉诺塔约 ' + time(Math.log10(Math.pow(2, 64) - 1)) + '。',
    100: () => '课上的表：n = 100 时 2ⁿ 也不可行了。',
    1e9: () => '课上的表：n 只要 ' + time(9) + '，n² 却要 ' + time(18) + '。',
  };

  function describe(n, lgs) {
    let s = 'n = <b>' + nText(n) + '</b>：';
    const st = lgs.map(status);
    if (st.every(x => x === 'ok')) {
      s += '每一级都在 1 秒内。';
    } else {
      let hi = -1;
      st.forEach((x, k) => { if (x === 'ok') hi = k; });
      s += '1 秒内能算完的最高一级是 <b>' + CLASSES[hi].name + '</b>（' + time(lgs[hi]) + '）';
      const bad = st.indexOf('bad');
      s += bad < 0 ? '，没有一级超过 1 年。'
        : '；从 <b>' + CLASSES[bad].name + '</b> 起超过 1 年（' + time(lgs[bad]) + '）。';
    }
    // for small n the ladder order is not visible yet
    for (let k = 1; k + 1 < lgs.length; k++) {
      if (lgs[k] > lgs[k + 1] + EPS) {
        s += ' n 还小时阶梯顺序看不出来：此时 ' + CLASSES[k].name + ' = ' + num(lgs[k]) +
          '，比 ' + CLASSES[k + 1].name + ' = ' + num(lgs[k + 1]) + ' 还大。';
        break;
      }
    }
    if (REMARK[n]) s += ' ' + REMARK[n]();
    return s;
  }

  const frames = SIZES.map(n => {
    const lgs = CLASSES.map(c => c.lg(n));
    return { n, lgs, note: describe(n, lgs) };
  });
  // </algo>

  /* ── chart built once; render() only updates widths and texts ── */
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  const pct = lg => Math.min(100, Math.max(0, lg / AXIS_MAX * 100));
  const MARKS = [
    { lg: 3, text: '1 µs' },
    { lg: LOG_RATE, text: '1 秒' },
    { lg: LOG_RATE + LOG_YEAR, text: '1 年' },
    { lg: LOG_RATE + LOG_YEAR + LOG_UNIVERSE, text: '宇宙年龄' },
  ];

  const chart = el('div', 'chart');
  const axisRow = el('div', 'row');
  const axis = el('div', 'axis');
  MARKS.forEach(m => {
    const t = el('span', '', m.text);
    t.style.left = pct(m.lg) + '%';
    axis.appendChild(t);
  });
  axisRow.appendChild(el('span'));
  axisRow.appendChild(axis);
  axisRow.appendChild(el('span'));
  chart.appendChild(axisRow);

  const rows = CLASSES.map(c => {
    const row = el('div', 'row');
    const track = el('div', 'track');
    MARKS.forEach(m => {
      const mk = el('span', 'mark');
      mk.style.left = pct(m.lg) + '%';
      track.appendChild(mk);
    });
    const bar = el('div', 'bar');
    track.appendChild(bar);
    const val = el('div', 'val');
    const t = el('span', 't');
    const cnt = el('span', 'c');
    val.appendChild(t);
    val.appendChild(cnt);
    row.appendChild(el('span', 'cls', K.esc(c.name)));
    row.appendChild(track);
    row.appendChild(val);
    chart.appendChild(row);
    return { bar, t, cnt };
  });
  stage.appendChild(chart);

  const box = el('span', 'nbox');
  box.appendChild(el('span', 'label', 'n ='));
  const slider = el('input');
  slider.type = 'range';
  slider.min = '0';
  slider.max = String(frames.length - 1);
  slider.step = '1';
  slider.setAttribute('aria-label', '输入规模 n');
  const nval = el('span', 'nval');
  box.appendChild(slider);
  box.appendChild(nval);
  controls.appendChild(box);

  function render(f, idx) {
    slider.value = String(idx);
    nval.innerHTML = nText(f.n);
    f.lgs.forEach((lg, k) => {
      const st = status(lg);
      const r = rows[k];
      r.bar.style.width = pct(lg) + '%';
      r.bar.className = 'bar ' + st + (lg > AXIS_MAX ? ' over' : '');
      r.t.className = 't ' + st;
      r.t.innerHTML = time(lg);
      r.cnt.innerHTML = num(lg) + ' 次';
    });
  }

  const player = window.AnimKit.player({ frames, render, interval: 1300 });
  slider.addEventListener('input', () => player.go(+slider.value));
  player.go(SIZES.indexOf(20));
})();
</script>
</body>
</html>
