<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主定理计算器</title>
<link rel="stylesheet" href="/blog/blog_data/dsa/anim.css">
<style>
  .calc { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; }
  .calc .abd { display: inline-flex; flex-wrap: wrap; gap: 6px 12px; }
  .calc label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .calc label b { color: var(--text); font-weight: 700; }
  .calc input[type="number"] { width: 62px; }
  .calc .btn-group { flex-wrap: wrap; }
  .mt { position: absolute; inset: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .mt-in { margin: auto 0; display: flex; flex-direction: column; gap: 10px; padding: 2px 0; }
  .mt-head { text-align: center; font-size: 13px; line-height: 1.55; }
  .mt-head .rec { font-size: 15px; font-weight: 700; }
  .mt-head .res { font-size: 16px; font-weight: 700; color: var(--accent); }
  .mt-head .err { color: var(--red); font-weight: 700; }
  .mt-rows {
    display: grid; grid-template-columns: auto auto minmax(40px, 1fr) auto;
    gap: 4px 8px; align-items: center; font-size: 12px;
    width: 100%; max-width: 640px; margin: 0 auto;
  }
  .mt-rows > span { white-space: nowrap; transition: opacity 0.3s; }
  .mt-rows .h { color: var(--muted); font-size: 11px; }
  .mt-rows .lv { color: var(--muted); }
  .mt-rows .val { text-align: right; font-variant-numeric: tabular-nums; }
  .mt-rows .future { opacity: 0.25; }
  .mt-rows .cur { color: var(--text); font-weight: 700; }
  .track { display: block; height: 13px; border-radius: 4px; background: rgba(255, 255, 255, 0.05); position: relative; overflow: hidden; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: rgba(56, 189, 248, 0.55); transition: width 0.3s, background 0.3s; }
  .track.cur .fill { background: var(--accent); }
  .track.top .fill { background: var(--green); }
  .val.top { color: var(--green); font-weight: 700; }
  @media (max-width: 420px) {
    .mt-in { gap: 8px; }
    .mt-head { font-size: 12px; }
    .mt-head .rec { font-size: 14px; }
    .mt-head .res { font-size: 15px; }
    .mt-rows { gap: 3px 6px; }
  }
</style>
</head>
<body>
<div class="title">主定理计算器</div>
<div class="calc" id="calc"></div>
<div class="controls" id="controls"></div>
<div class="stage" id="stage"></div>
<div class="note" id="note"></div>
<script src="/blog/blog_data/dsa/anim.js"></script>
<script>
(function () {
  'use strict';
  const K = window.AnimKit;
  const stage = document.getElementById('stage');

  // inputs a, b, d and the preset recurrences
  const PRESETS = [['2,2,1', '2T(n/2)+n'], ['1,2,0', 'T(n/2)+1'], ['9,3,1', '9T(n/3)+n'],
    ['2,2,0', '2T(n/2)+1'], ['3,4,1', '3T(n/4)+n'], ['4,2,2', '4T(n/2)+n²']];
  const field = (id, name, min, max, step, value) =>
    '<label><b>' + name + '</b><input id="' + id + '" type="number" min="' + min + '" max="' + max +
    '" step="' + step + '" value="' + value + '" aria-label="' + name + '"></label>';
  document.getElementById('calc').innerHTML =
    '<span class="abd">' + field('in-a', 'a', 1, 1000, 1, 2) + field('in-b', 'b', 1.5, 100, 0.5, 2) +
    field('in-d', 'd', 0, 10, 0.5, 1) + '</span>' +
    '<span class="btn-group" id="presets">' +
    PRESETS.map(p => '<button type="button" data-p="' + p[0] + '">' + p[1] + '</button>').join('') + '</span>';
  const inA = document.getElementById('in-a');
  const inB = document.getElementById('in-b');
  const inD = document.getElementById('in-d');
  const presetBtns = Array.prototype.slice.call(document.querySelectorAll('#presets button'));

  const L = 5;                       // levels 0..L, n = b^L
  const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const near = (x, y) => Math.abs(x - y) <= 1e-9 * Math.max(1, Math.abs(x), Math.abs(y));

  // numbers in the table: integers as is, others to 3 significant digits, huge ones as m×10^e
  function fmt(x) {
    if (!isFinite(x)) return '∞';
    const ax = Math.abs(x);
    if (ax >= 1e7 || (ax > 0 && ax < 1e-3)) {
      const e = Math.floor(Math.log10(ax));
      const m = Number((x / Math.pow(10, e)).toPrecision(3));
      return m + '×10' + String(e).split('').map(c => (c === '-' ? '⁻' : SUP[+c])).join('');
    }
    if (near(x, Math.round(x))) return String(Math.round(x));
    return String(Number(x.toPrecision(3)));
  }
  // exponents: integers as is, otherwise up to 3 decimals
  function fmtE(e) {
    if (near(e, Math.round(e))) return String(Math.round(e));
    return String(Number(e.toFixed(3)));
  }
  function powN(e) {
    if (near(e, 0)) return '1';
    if (near(e, 1)) return 'n';
    return 'n<sup>' + fmtE(e) + '</sup>';
  }

  // Run the recursion tree level by level and record one frame per level.
  function build(a, b, d) {
    const ok = isFinite(a) && isFinite(b) && isFinite(d) && a >= 1 && b > 1 && d >= 0 && a <= 1000 && b <= 100 && d <= 10;
    if (!ok) {
      return [{ bad: true, note: '主定理要求 <b>a ≥ 1、b &gt; 1、d ≥ 0</b>（这里另限 a ≤ 1000、b ≤ 100、d ≤ 10）。' }];
    }
    const n = Math.pow(b, L);
    const bd = Math.pow(b, d);
    const r = a / bd;
    const kase = near(a, bd) ? 2 : a < bd ? 1 : 3;
    const lg = Math.log(a) / Math.log(b);
    const aS = fmt(a), bS = fmt(b), dS = fmtE(d);

    let result;
    if (kase === 1) result = 'Θ(' + powN(d) + ')';
    else if (kase === 2) result = near(d, 0) ? 'Θ(log n)' : 'Θ(' + powN(d) + ' log n)';
    else result = near(lg, Math.round(lg)) ? 'Θ(' + powN(lg) + ')'
      : 'Θ(n<sup>log<sub>' + bS + '</sub> ' + aS + '</sup>) ≈ Θ(n<sup>' + fmtE(lg) + '</sup>)';

    const rel = kase === 1 ? '&lt;' : kase === 2 ? '=' : '&gt;';
    let line2 = 'a = ' + aS + '，b<sup>d</sup> = ' + bS + '<sup>' + dS + '</sup> = ' + fmt(bd) +
      ' → a ' + rel + ' b<sup>d</sup> → 情况 ' + kase;
    if (kase === 3) line2 += '，log<sub>' + bS + '</sub> ' + aS + (near(lg, Math.round(lg)) ? ' = ' : ' ≈ ') + fmtE(lg);
    const fTerm = near(d, 0) ? '1' : powN(d);
    const head = {
      rec: 'T(n) = ' + (near(a, 1) ? '' : aS) + 'T(n/' + bS + ') + ' + fTerm,
      line2,
      res: 'T(n) ∈ ' + result,
    };

    const rows = [];
    for (let i = 0; i <= L; i++) {
      const cnt = Math.pow(a, i);
      const size = Math.pow(b, L - i);   // n / b^i
      const each = Math.pow(size, d);
      rows.push({ i, cnt, size, each, cost: cnt * each });
    }
    const total = rows.reduce((s, x) => s + x.cost, 0);
    const dom = kase === 1 ? [0] : kase === 3 ? [L] : rows.map(x => x.i);
    const info = { head, rows, dom };

    const frames = [];
    let sum = 0;
    rows.forEach(row => {
      sum += row.cost;
      let note = row.i === 0
        ? '设 n = b<sup>' + L + '</sup> = ' + fmt(n) + '，递归树共 ' + (L + 1) + ' 层。第 0 层（根）：1 个规模 n 的问题，'
        : '第 ' + row.i + ' 层' + (row.i === L ? '（叶子）' : '') + '：a<sup>' + row.i + '</sup> = ' + fmt(row.cnt) + ' 个子问题，每个规模 ' + fmt(row.size) + '，';
      const sz = fmt(row.size);
      note += '每个代价 ' + (sz.indexOf('×') >= 0 ? '(' + sz + ')' : sz) + '<sup>' + dS + '</sup> = ' + fmt(row.each) + '，本层合计 <b>' + fmt(row.cost) + '</b>';
      note += row.i === 0 ? '。' : '，是上一层的 a/b<sup>d</sup> = ' + fmt(r) + ' 倍。';
      if (row.i > 0) note += ' 前 ' + (row.i + 1) + ' 层累计 ' + fmt(sum) + '。';
      frames.push({ info, cur: row.i, shown: row.i, final: false, note });
    });

    let fin = '合计 ' + fmt(total) + '。';
    if (kase === 1) {
      fin += '每往下一层乘 r = ' + fmt(r) + ' &lt; 1，合计不超过第 0 层的 1/(1−r) = ' + fmt(1 / (1 - r)) +
        ' 倍，根上的 f(n) 决定量级 → <b>情况 1：' + result + '</b>。';
    } else if (kase === 2) {
      fin += 'r = a/b<sup>d</sup> = 1，每层都是 n<sup>d</sup> = ' + fmt(rows[0].cost) + '，共 log<sub>b</sub> n + 1 = ' + (L + 1) +
        ' 层 → <b>情况 2：' + result + '</b>。';
    } else {
      fin += '每往下一层乘 r = ' + fmt(r) + ' &gt; 1，合计不超过最底层的 r/(r−1) = ' + fmt(r / (r - 1)) +
        ' 倍，叶子数 a<sup>log<sub>b</sub> n</sup> = n<sup>log<sub>b</sub> a</sup> 决定量级 → <b>情况 3：' + result + '</b>。';
    }
    frames.push({ info, cur: -1, shown: L, final: true, note: fin });
    return frames;
  }

  function render(f) {
    if (f.bad) {
      stage.innerHTML = '<div class="mt"><div class="mt-in"><div class="mt-head"><div class="err">参数不满足定理的条件</div></div></div></div>';
      return;
    }
    const s = f.info;
    const max = Math.max.apply(null, s.rows.map(x => x.cost));
    let grid = '<span class="h">层</span><span class="h">个数 × 规模</span><span class="h"></span><span class="h val">本层代价</span>';
    s.rows.forEach(row => {
      const shown = row.i <= f.shown;
      let c = '';
      if (!shown) c = 'future';
      else if (row.i === f.cur) c = 'cur';
      else if (f.final && s.dom.indexOf(row.i) >= 0) c = 'top';
      const w = shown ? Math.max(1.5, row.cost / max * 100) : 0;
      grid += '<span class="lv ' + c + '">层 ' + row.i + '</span>' +
        '<span class="sub ' + c + '">' + K.esc(fmt(row.cnt) + ' × ' + fmt(row.size)) + '</span>' +
        '<span class="track ' + c + '"><span class="fill" style="width:' + w.toFixed(1) + '%"></span></span>' +
        '<span class="val ' + c + '">' + (shown ? K.esc(fmt(row.cost)) : '') + '</span>';
    });
    stage.innerHTML = '<div class="mt"><div class="mt-in"><div class="mt-head">' +
      '<div class="rec">' + s.head.rec + '</div><div>' + s.head.line2 + '</div><div class="res">' + s.head.res + '</div>' +
      '</div><div class="mt-rows">' + grid + '</div></div></div>';
  }

  function current() { return [parseFloat(inA.value), parseFloat(inB.value), parseFloat(inD.value)]; }
  function markPreset() {
    const v = current();
    presetBtns.forEach(btn => {
      const p = btn.getAttribute('data-p').split(',').map(Number);
      btn.classList.toggle('active', p[0] === v[0] && p[1] === v[1] && p[2] === v[2]);
    });
  }

  const player = window.AnimKit.player({ frames: build.apply(null, current()), render, interval: 1300 });
  markPreset();

  function refresh() { player.load(build.apply(null, current())); markPreset(); }
  [inA, inB, inD].forEach(el => el.addEventListener('input', refresh));
  presetBtns.forEach(btn => btn.addEventListener('click', () => {
    const p = btn.getAttribute('data-p').split(',');
    inA.value = p[0]; inB.value = p[1]; inD.value = p[2];
    refresh();
  }));
})();
</script>
</body>
</html>
